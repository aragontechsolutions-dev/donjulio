services:
  db:
    image: postgres:16-alpine
    container_name: donjulio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: donjulio
      POSTGRES_PASSWORD: donjulio
      POSTGRES_DB: donjulio
    ports:
      - "5432:5432"
    volumes:
      - donjulio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donjulio -d donjulio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  donjulio_pgdata:
