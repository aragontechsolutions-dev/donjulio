# Blueprint de Render para la API NestJS de Don Julio.
# Importar desde el dashboard de Render (New → Blueprint) apuntando al repo.
# Las variables marcadas `sync: false` se cargan a mano en el dashboard.
services:
  - type: web
    name: donjulio-api
    runtime: node
    plan: free
    region: oregon
    # corepack habilita pnpm según el campo packageManager del package.json raíz.
    # En Render las variables ya están en el entorno, por eso se llama a prisma
    # con `exec` (sin el wrapper dotenv que usan los scripts para desarrollo local).
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @donjulio/shared build &&
      pnpm --filter @donjulio/api exec prisma generate &&
      pnpm --filter @donjulio/api build
    # Aplica migraciones y arranca. prisma migrate deploy usa DIRECT_URL.
    startCommand: >-
      pnpm --filter @donjulio/api exec prisma migrate deploy &&
      node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # No hace falta setear PORT: Render lo inyecta y main.ts lo respeta.
      - key: DATABASE_URL # pooler de Supabase (6543, ?pgbouncer=true)
        sync: false
      - key: DIRECT_URL # conexión directa de Supabase (5432)
        sync: false
      - key: CORS_ORIGIN # URLs de Vercel (web y pwa), separadas por coma
        sync: false

      # ── Auth: "local" (JWT propio) o "supabase" (Supabase Auth) ──
      # Va sin `value` A PROPÓSITO. Con un valor fijo acá, cada sincronización
      # del blueprint lo vuelve a aplicar y pisa lo que esté puesto en el
      # dashboard: una cuenta que ya pasó a Supabase Auth volvería a "local"
      # sola, y nadie podría entrar al panel. Se define en el dashboard.
      - key: AUTH_PROVIDER
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render genera un secreto fuerte
      - key: JWT_EXPIRES_IN
        value: "12h"

      # Con AUTH_PROVIDER=supabase: el "JWT Secret" del proyecto
      # (Settings → API → JWT Settings, HS256).
      - key: SUPABASE_JWT_SECRET
        sync: false

      # ── Storage en Supabase desde el inicio ──
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: donjulio
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY # secreta; sólo en el backend
        sync: false

      # mock | mercadopago. Sin `value`: ver la nota de AUTH_PROVIDER.
      - key: PAYMENTS_PROVIDER
        sync: false

      # ── Terminal de tarjetas del mostrador (Mercado Pago Point) ──
      # Vacío = sin posnet integrado, la cajera cobra a mano como siempre.
      # Para prenderlo: "mercadopago" + MP_ACCESS_TOKEN y MP_TERMINAL_ID.
      # Ver docs/MERCADOPAGO-POINT.md.
      - key: TERMINAL_PROVIDER
        sync: false
      - key: MP_TERMINAL_ID
        sync: false
      - key: MP_ACCESS_TOKEN # secreta; sólo en el backend
        sync: false
      - key: MP_WEBHOOK_SECRET # firma de los avisos de Mercado Pago
        sync: false
      # mock | surtec | uruware. Sin `value`: ver la nota de AUTH_PROVIDER.
      - key: BILLING_PROVIDER
        sync: false
