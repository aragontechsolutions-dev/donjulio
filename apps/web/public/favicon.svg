<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon Don Julio: chapa carbón, monograma crema y rombo terracota.
       Usa serif del sistema: los favicons SVG no cargan webfonts. -->
