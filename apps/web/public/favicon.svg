  <text x="32" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="44" letter-spacing="-9" fill="#F5F0E6">DJ</text>
  <rect x="30.5" y="17.5" width="9" height="9" fill="#C0561D" transform="rotate(45 35 22)"/>
</svg>
